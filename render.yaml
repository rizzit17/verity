services:
  - type: web
    name: verity
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
